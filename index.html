<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice de páginas</title>
    <style>
        ul {
    	display: flex;
    	margin: auto;
    	gap: 1rem;
    } 
    li {
        list-style: none;
    }
    a {
    	display: block;
    	background-color: darkcyan;
    	color: white;
    	width: 200px;
    	text-align: center;
    	padding: .5rem;
    	text-decoration: none;
    	font-weight: bold;
    	font-family: 'Tahoma';
    	border-radius: .2rem;
        box-shadow: 1px 1px 2px darkgrey;
    }
    main {
	    display: flex;
	    margin: auto;
	    padding: 5rem;
    }
    </style>
</head>
<body>
  <main>
        <ul>
            <li><a href="https://cursoweb.tech/esther2/calendario/">Calendario</a></li>
            <li><a href="https://cursoweb.tech/esther2/carrito_compra/">Carrito de la compra</a></li>
        </ul>
  </main>
</body>
</html>
